name: Assemble STATUS.md

# Weekly batch run of scripts/assemble-status.js: turns any pending
# docs/status/fragments/*.md files into dated STATUS.md entries and opens a
# PR with the result. No-ops (no PR) when there's nothing pending. Also
# runnable on demand via workflow_dispatch, e.g. right before a review pass
# that wants STATUS.md caught up. See docs/status/fragments/README.md and
# scripts/assemble-status.js for why this exists.

on:
  schedule:
    - cron: '0 14 * * 1' # Monday 14:00 UTC
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble fragments
        run: node scripts/assemble-status.js

      - name: Open PR if fragments were assembled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pending fragments — nothing to assemble."
            exit 0
          fi

          BRANCH="status-assembly-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add STATUS.md docs/status/fragments
          git commit -m "STATUS.md: assemble pending fragments"
          git push origin "$BRANCH"

          gh pr create \
            --title "STATUS.md: assemble pending fragments" \
            --body "Automated run of \`scripts/assemble-status.js\` — converts pending \`docs/status/fragments/*.md\` files into dated \`STATUS.md\` entries." \
            --base main \
            --head "$BRANCH"
