name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Bumped from 20 with #137's suite: jsdom 29 requires ^20.19 || ^22.13
          # || >=24, so a bare `20` would have depended on setup-node happening
          # to resolve a late-enough 20.x. 22 is current LTS and closer to the
          # Node the app is actually developed against.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # Report-only on purpose: the first real `npm run lint` pass found 13
      # pre-existing findings (dead exports, unused params, one already-known
      # bug in public/export.js flagged in a code comment). continue-on-error
      # stays here until a few consecutive clean weeks confirm no backlog is
      # accumulating — then drop it so lint/format actually gate merges.
      - name: Lint (report-only)
        run: npm run lint
        continue-on-error: true

      - name: Format check (report-only)
        run: npm run format:check
        continue-on-error: true

      # #137 — unit suite (node:test + jsdom). No server, no API key; runs
      # before the smoke test so a logic regression fails fast and reports as
      # itself rather than as a mysterious smoke-test failure. See test/README.md.
      - name: Unit tests
        run: npm test

      - name: Scene scaffold smoke test
        env:
          PORT: 3132
          LOCAL: 'true'
          ANTHROPIC_API_KEY: unused-in-ci
          SESSION_SECRET: unused-in-ci
        run: |
          npm run dev &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf "http://localhost:$PORT/" > /dev/null && break
            sleep 1
          done
          node scripts/test-scene-scaffold.js
          kill $SERVER_PID
