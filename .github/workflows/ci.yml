name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # #407 follow-up: dorny/paths-filter calls the GitHub API to list a PR's
    # changed files, which needs pull-requests: read on GITHUB_TOKEN — the
    # repo's default token permissions don't include it, so the very first
    # run failed with "Resource not accessible by integration" before any
    # of this job's own steps ran. contents: read is the default checkout
    # needs anyway; stated explicitly here since granting any permissions
    # block turns off the broader repo-wide default grant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Bumped from 20 with #137's suite: jsdom 29 requires ^20.19 || ^22.13
          # || >=24, so a bare `20` would have depended on setup-node happening
          # to resolve a late-enough 20.x. 22 is current LTS and closer to the
          # Node the app is actually developed against.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      # #407 — gated on path, not run unconditionally: it makes real network
      # calls (archive.org, crossref) to catch fabricated source_urls (#157),
      # so it should only ever block a PR that's actually touching library
      # entries, never an unrelated change. Hard gate (no continue-on-error)
      # since the current 38 entries are already clean — see #35's tracked
      # coverage — so there's no pre-existing backlog to report-only around,
      # unlike lint/format below.
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            library:
              - 'prompts/library/**'

      - name: Verify library sources
        if: steps.filter.outputs.library == 'true'
        run: node scripts/verify-library-sources.js

      # Hard gate as of #496/#544: continue-on-error stayed on since #35's
      # 2026-08-12 baseline (13 findings) but the backlog oscillated instead
      # of shrinking -- three manual resets in the week before this change,
      # each regrowing within 1-4 days (see #496's history table). The root
      # cause was this flag itself: continue-on-error means the step reports
      # success regardless of its actual exit code, so a PR reintroducing
      # drift still showed a green CI run with nothing prompting a fix
      # before merge. Confirmed clean against a fresh CI run on #544 before
      # removing it here.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # #137 — unit suite (node:test + jsdom). No server, no API key; runs
      # before the smoke test so a logic regression fails fast and reports as
      # itself rather than as a mysterious smoke-test failure. See test/README.md.
      - name: Unit tests
        run: npm test

      - name: Scene scaffold smoke test
        env:
          PORT: 3132
          LOCAL: 'true'
          ANTHROPIC_API_KEY: unused-in-ci
          SESSION_SECRET: unused-in-ci
        run: |
          npm run dev &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf "http://localhost:$PORT/" > /dev/null && break
            sleep 1
          done
          node scripts/test-scene-scaffold.js
          kill $SERVER_PID
