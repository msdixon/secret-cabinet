<!-- @dsCard group="Components" viewport="700x350" name="Layout" subtitle="Panel and Card containers" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../../public/css/style.css" />
  <style>
    body { padding: 20px; background: var(--lodge-bg); }
    .panel { background: var(--lodge-surface); border: 1px solid var(--lodge-border); border-radius: 2px; padding: 16px; margin-bottom: 12px; }
    .panel-label { font-family: 'IM Fell English', serif; font-size: 12px; color: var(--lodge-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-label">I. The Provocation</div>
    <p style="font-family: 'Crimson Pro', serif; color: var(--lodge-cream); line-height: 1.6; margin: 0;">Paste the entry here. The room will hear it.</p>
  </div>
  <div class="panel">
    <div class="panel-label">II. The Assembled</div>
    <p style="font-family: 'Crimson Pro', serif; color: var(--lodge-muted); line-height: 1.6; margin: 0;">Members cast per session, cast by the document's content.</p>
  </div>
</body>
</html>
